name: Release

# Push a tag like v0.2.1 to test, build the installer and publish a GitHub release.
# "Run workflow" (manual) builds the installer as a downloadable artifact only; nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a trial build (no release is published)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history and tags, for the list of changes since the previous release

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          "value=$v" >> $env:GITHUB_OUTPUT
          "Building version $v"

      - name: Test, publish and build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Checksum and release notes
        shell: pwsh
        run: |
          $name = 'EVSEQ-Setup-${{ steps.version.outputs.value }}.exe'
          $hash = (Get-FileHash "artifacts/installer/$name" -Algorithm SHA256).Hash
          "$hash  $name" | Set-Content artifacts/installer/SHA256SUMS.txt

          # Changes: commit subjects since the previous release tag
          $ref = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { 'HEAD' }
          $prev = git describe --tags --abbrev=0 "$ref^" 2>$null
          $range = if ($prev) { "$prev..$ref" } else { $ref }
          $changes = (git log $range --no-merges --pretty='- %s' | Out-String).Trim()
          if (-not $changes) { $changes = '- (tidak ada perubahan)' }
          "Changes since ${prev}:`n$changes"

          (Get-Content .github/release-notes.md -Raw).Replace('{{VERSION}}', '${{ steps.version.outputs.value }}').Replace('{{SHA256}}', $hash).Replace('{{CHANGES}}', $changes) |
            Set-Content artifacts/release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: EVSEQ-Setup-${{ steps.version.outputs.value }}
          path: |
            artifacts/installer/*.exe
            artifacts/installer/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            'artifacts/installer/EVSEQ-Setup-${{ steps.version.outputs.value }}.exe' artifacts/installer/SHA256SUMS.txt `
            --title 'EVSEQ ${{ steps.version.outputs.value }}' `
            --notes-file artifacts/release-notes.md --generate-notes --verify-tag
